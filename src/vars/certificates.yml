---
certificates_ca_directory: /var/lib/foremanctl/certs
certificates_server_aliases: "{{ server_aliases | default([]) }}"
_certificates_type: "{{ certificates_primary_algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"
ca_key: >-
  {% if certificates_enabled_algorithms | length == 1 %}{{ certificates_ca_directory }}/private/ca.key
  {%- else %}{{ certificates_ca_directory }}/private/{{ _certificates_type }}-ca.key{% endif %}
internal_ca_bundle: "{{ certificates_ca_directory }}/certs/internal-ca-bundle.crt"
ca_bundle: >-
  {% if certificates_source == 'custom_server' %}{{ certificates_ca_directory }}/certs/ca-bundle.crt
  {%- else %}{{ internal_ca_bundle }}{% endif %}
ca_certificate: >-
  {% if certificates_enabled_algorithms | length == 1 %}{{ certificates_ca_directory }}/certs/ca.crt
  {%- else %}{{ certificates_ca_directory }}/certs/{{ _certificates_type }}-ca.crt{% endif %}
server_certificate: "{{ certificates_ca_directory }}/certs/{{ ansible_facts['fqdn'] }}.crt"
server_key: "{{ certificates_ca_directory }}/private/{{ ansible_facts['fqdn'] }}.key"
server_ca_certificate: >-
  {% if certificates_source == 'custom_server' %}{{ certificates_ca_directory }}/certs/server-ca.crt{%- else %}{{ ca_certificate }}{% endif %}
client_certificate: "{{ certificates_ca_directory }}/certs/{{ ansible_facts['fqdn'] }}-client.crt"
client_key: "{{ certificates_ca_directory }}/private/{{ ansible_facts['fqdn'] }}-client.key"
client_ca_certificate: "{{ internal_ca_bundle }}"
candlepin_tomcat_key: "{{ certificates_ca_directory }}/private/candlepin.key"
candlepin_tomcat_certificate: "{{ certificates_ca_directory }}/certs/candlepin.crt"

iop_gateway_server_certificate: "{{ certificates_ca_directory }}/certs/iop-core-gateway.crt"
iop_gateway_server_key: "{{ certificates_ca_directory }}/private/iop-core-gateway.key"
iop_gateway_server_ca_certificate: "{{ internal_ca_bundle }}"
iop_gateway_client_certificate: >-
  {{ certificates_ca_directory }}/certs/iop-core-gateway-client-{{ certificates_client_algorithm_type | lower | regex_replace('^ml-dsa', 'mldsa') }}.crt
iop_gateway_client_key: >-
  {{ certificates_ca_directory }}/private/iop-core-gateway-client-{{ certificates_client_algorithm_type | lower | regex_replace('^ml-dsa', 'mldsa') }}.key
iop_gateway_client_ca_certificate: "{{ ca_bundle }}"
iop_vmaas_client_ca_certificate: "{{ ca_bundle }}"
iop_vuln_metadata_downloader_client_cert: "{{ client_certificate }}"
iop_vuln_metadata_downloader_client_key: "{{ client_key }}"
iop_vuln_metadata_downloader_client_ca: "{{ client_ca_certificate }}"

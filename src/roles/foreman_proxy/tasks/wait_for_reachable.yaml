---
# Shared by foreman_proxy/tasks/main.yaml (both the initial deploy-time proxy
# restart ahead of registration, and the end-of-role handler flush that can
# restart the proxy again on every deploy run) and the backup role
# (post-backup restart of foreman.target). All of these restart the
# foreman-proxy container on a Podman bridge network, where Netavark/
# aardvark-dns needs a moment to reconverge before Foreman can resolve/reach
# the proxy again.
# Self-contained (including the `when`) so callers don't need to duplicate
# the feature gating: only meaningful when both Foreman and its proxy are
# part of the deployment being acted on.
- name: Wait for Foreman Proxy API to be reachable from Foreman
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - foreman
      - curl
      - --silent
      - --show-error
      - --fail
      - --connect-timeout
      - "5"
      - --max-time
      - "10"
      - --cacert
      - /etc/foreman/katello-default-ca.crt
      - --cert
      - /etc/foreman/client_cert.pem
      - --key
      - /etc/foreman/client_key.pem
      # foreman_proxy_registration_url is an optional, user-supplied override
      # with no default, so fall back to the proxy's own real URL (matching
      # foreman_proxy_url's own default) when it isn't set.
      - "{{ foreman_proxy_registration_url | default('https://' ~ ansible_facts['fqdn'] ~ ':8443') }}/v2/features"
  register: _foreman_proxy_features
  when:
    - "enabled_features | has_feature('foreman')"
    - "enabled_features | has_feature('foreman-proxy')"
  changed_when: false
  retries: 30
  delay: 5
  until: _foreman_proxy_features.rc == 0

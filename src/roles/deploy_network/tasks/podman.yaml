---
# netavark 2.0 changed the bridge driver's isolation default from opt-in to
# opt-out (containers/netavark#709): a bridge network created with no explicit
# isolate option is now isolated from every other bridge network by default,
# whereas netavark 1.x left it non-isolated by default. We always pass an
# explicit isolate value (strict or false) so behavior is deterministic
# regardless of the installed netavark's own default, rather than relying on
# omission (which silently produces isolation on netavark 2+ for every
# network we did NOT intend to isolate, breaking hairpin NAT between them).
#
# This is done via the CLI rather than containers.podman.podman_network
# because that module (as of 1.20.2) serializes opt.isolate booleans as
# Python-style True/False, which Podman 6 + netavark 2 reject ("invalid
# isolate option \"True\""/"\"False\""). Upstream fixed this on main in
# containers/ansible-podman-collections commit d45819fd6561, but until that
# reaches a released collection we create/normalize these networks via the
# CLI with the explicit lowercase value form Podman currently documents.
- name: Inspect existing network {{ deploy_network_name }}
  ansible.builtin.command:
    argv:
      - podman
      - network
      - inspect
      - "{{ deploy_network_name }}"
  register: deploy_network_existing_inspect
  changed_when: false
  failed_when: false

- name: Create network {{ deploy_network_name }}
  ansible.builtin.command:
    cmd: >-
      podman network create
      --driver {{ deploy_network_driver | quote }}
      {% if deploy_network_internal %} --internal{% endif %}
      {% if deploy_network_ipv6 %} --ipv6{% endif %}
      {% if deploy_network_subnet is defined %} --subnet {{ deploy_network_subnet | quote }}{% endif %}
      {% if deploy_network_gateway is defined %} --gateway {{ deploy_network_gateway | quote }}{% endif %}
      {% for dns_server in deploy_network_dns | default([]) %} --dns {{ dns_server | quote }}{% endfor %}
      --opt isolate={{ 'strict' if (deploy_network_isolate | bool) else 'false' }}
      {{ deploy_network_name | quote }}
  changed_when: true
  when: deploy_network_existing_inspect.rc != 0

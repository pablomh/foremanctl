---
- name: 'Require Enterprise Linux 10 or later for ML-DSA certificates'
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
        and ansible_facts['distribution_major_version'] | int >= 10
    fail_msg: >-
      ML-DSA certificate algorithms require Enterprise Linux 10 or later, which
      ships post-quantum algorithms in its default crypto policy. This host is
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}.
      Remove ML-DSA entries from certificates_algorithm_sets or deploy on RHEL 10+.
    quiet: true
  when: >-
    (certificates_algorithm_sets | select('match', '^ML-DSA') | list | length > 0)
    or (certificates_client_algorithm_type is match('^ML-DSA'))

- name: 'Require certificates_algorithm_type to be included in certificates_algorithm_sets'
  ansible.builtin.assert:
    that: certificates_algorithm_type in certificates_algorithm_sets
    fail_msg: >-
      certificates_algorithm_type ({{ certificates_algorithm_type }}) must be included
      in certificates_algorithm_sets ({{ certificates_algorithm_sets | join(', ') }}) so
      its CA is generated. Add it to certificates_algorithm_sets or change
      certificates_algorithm_type to one of its entries.
    quiet: true
  when: certificates_algorithm_sets | length > 0

- name: 'Install crypto dependencies'
  ansible.builtin.package:
    name:
      - python3-cryptography
    state: present

- name: 'Create base directory'
  ansible.builtin.file:
    path: "{{ certificates_ca_directory }}"
    state: directory
    mode: '0755'

- name: 'Create OAuth directory'
  ansible.builtin.file:
    path: "{{ certificates_oauth_directory }}"
    state: directory
    mode: '0755'

- name: 'Create certs directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_certs }}"
    state: directory
    mode: '0755'

- name: 'Create keys directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_keys }}"
    state: directory
    mode: '0755'

- name: 'Create requests directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_requests }}"
    state: directory
    mode: '0755'

- name: 'Generate certificates'
  when:
    - auth_bundle is not defined
    - certificates_generate
  block:
    - name: 'Generate CA certificate'
      ansible.builtin.include_tasks: ca.yml
      when:
        - certificates_ca

    - name: Issue host certificates
      ansible.builtin.include_tasks: host.yml
      when:
        - certificates_hostnames is defined
      with_items: "{{ certificates_hostnames }}"
      loop_control:
        loop_var: certificates_hostname

    - name: Issue the foreman-proxy client certificate
      ansible.builtin.include_tasks: foreman_proxy_client_certificate.yml

    - name: Create CA bundle with internal CA and custom server CA
      ansible.builtin.assemble:
        src: "{{ certificates_ca_directory_certs }}"
        dest: "{{ certificates_ca_directory_certs }}/ca-bundle.crt"
        regexp: '(ca|server-ca)\.crt$'
        mode: '0444'
      when:
        - certificates_source == 'custom_server'

- name: 'Consume certs'
  when:
    - auth_bundle is defined
    - not certificates_generate
  block:
    - name: Extract proxy auth bundle
      ansible.builtin.include_tasks: extract.yml

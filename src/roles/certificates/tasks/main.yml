---
- name: 'Require Enterprise Linux 10.3 or later for ML-DSA certificates'
  ansible.builtin.assert:
    that:
      - certificates_enabled_algorithms | select('match', '^ML-DSA') | list | length == 0
        or (
          ansible_facts['os_family'] == 'RedHat'
          and ansible_facts['distribution_major_version'] | int >= 10
          and (
            ansible_facts['distribution'] != 'RedHat'
            or ansible_facts['distribution_version'] is version('10.3', '>=')
          )
        )
    fail_msg: >-
      ML-DSA certificate algorithms ({{ certificates_enabled_algorithms | select('match', '^ML-DSA') | join(', ') }})
      require Enterprise Linux 10.3 or later, which ships the post-quantum crypto stack
      (python-cryptography and OpenSSL) needed to generate and sign the keys.
      This host is {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}. Remove them from
      certificates_algorithms, or deploy on RHEL 10.3 or later.
    quiet: true

- name: 'Install crypto dependencies'
  ansible.builtin.package:
    name:
      - python3-cryptography
    state: present

- name: 'Create base directory'
  ansible.builtin.file:
    path: "{{ certificates_ca_directory }}"
    state: directory
    mode: '0755'

- name: 'Create OAuth directory'
  ansible.builtin.file:
    path: "{{ certificates_oauth_directory }}"
    state: directory
    mode: '0755'

- name: 'Create certs directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_certs }}"
    state: directory
    mode: '0755'

- name: 'Create keys directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_keys }}"
    state: directory
    mode: '0755'

- name: 'Create requests directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_requests }}"
    state: directory
    mode: '0755'

- name: 'Remove unused localhost certificate files'
  # Clean up possible leftovers from a previous foremanctl version.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ certificates_output_directory_certs }}/localhost.crt"
    - "{{ certificates_output_directory_keys }}/localhost.key"
    - "{{ certificates_output_directory_requests }}/localhost.csr"
    - "{{ certificates_output_directory_certs }}/localhost-client.crt"
    - "{{ certificates_output_directory_keys }}/localhost-client.key"
    - "{{ certificates_output_directory_requests }}/localhost-client.csr"

- name: 'Generate certificates'
  when:
    - auth_bundle is not defined
    - certificates_generate
  block:
    - name: 'Generate CA certificate'
      ansible.builtin.include_tasks: ca.yml
      when:
        - certificates_ca

    - name: Issue host certificates
      ansible.builtin.include_tasks: host.yml
      when:
        - certificates_hostnames is defined
      with_items: "{{ certificates_hostnames }}"
      loop_control:
        loop_var: certificates_hostname

    - name: Create CA bundle with internal CA(s) and custom server CA
      ansible.builtin.assemble:
        src: "{{ certificates_ca_directory_certs }}"
        dest: "{{ certificates_ca_directory_certs }}/ca-bundle.crt"
        regexp: '^(internal-ca-bundle|server-ca)\.crt$'
        mode: '0444'
      when:
        - certificates_source == 'custom_server'

- name: 'Consume certs'
  when:
    - auth_bundle is defined
    - not certificates_generate
  block:
    - name: Extract proxy auth bundle
      ansible.builtin.include_tasks: extract.yml

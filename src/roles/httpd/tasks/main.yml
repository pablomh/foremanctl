---
- name: Install Apache httpd
  ansible.builtin.package:
    name:
      - httpd
      - mod_ssl
    state: present

- name: Set httpd_can_network_connect so Apache can reverse proxy to TCP backends
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when:
    - ansible_facts['selinux']['status'] == "enabled"
    - httpd_foreman_backend is match('^https?://')

- name: Set daemons_enable_cluster_mode so Apache can connect to unix sockets
  ansible.posix.seboolean:
    name: daemons_enable_cluster_mode
    state: true
    persistent: true
  when: ansible_facts['selinux']['status'] == "enabled"

- name: Set httpd_can_network_relay so Apache can reverse proxy to remote servers
  ansible.posix.seboolean:
    name: httpd_can_network_relay
    state: true
    persistent: true
  when:
    - ansible_facts['selinux']['status'] == "enabled"
    - not httpd_with_foreman

- name: Disable welcome page
  ansible.builtin.file:
    path: /etc/httpd/conf.d/welcome.conf
    state: absent

- name: Create cert directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ httpd_ssl_dir }}/certs"
    - "{{ httpd_ssl_dir }}/private"

- name: Create pub directory
  ansible.builtin.file:
    path: "{{ httpd_pub_dir }}"
    state: directory
    group: apache
    owner: apache
    mode: "0755"

- name: Deploy certificates
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ httpd_ssl_dir }}/{{ item.dest }}"
    remote_src: true
    mode: "0640"
  loop:
    - src: "{{ httpd_ca_bundle }}"
      dest: "certs/katello-server-ca.crt"
    - src: "{{ httpd_client_ca_certificate }}"
      dest: "certs/katello-default-ca.crt"
  notify:
    - Restart httpd

- name: Deploy single-algorithm server certificate chain and key
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', httpd_server_certificate) }}\n{{ lookup('ansible.builtin.file', httpd_server_ca_certificate) }}\n"
    dest: "{{ httpd_ssl_dir }}/certs/katello-apache-{{ certificates_primary_algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}.crt"
    mode: "0640"
  when: certificates_enabled_algorithms | length == 1
  notify:
    - Restart httpd

- name: Deploy single-algorithm server key
  ansible.builtin.copy:
    src: "{{ httpd_server_key }}"
    dest: "{{ httpd_ssl_dir }}/private/katello-apache-{{ certificates_primary_algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}.key"
    remote_src: true
    mode: "0640"
  when: certificates_enabled_algorithms | length == 1
  notify:
    - Restart httpd

# Each leaf embeds its own matching CA (a shared chain file would be wrong for every leaf but one).
- name: Deploy per-algorithm server certificate chains
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', cert_src) }}\n{{ lookup('ansible.builtin.file', ca_src) }}\n"
    dest: "{{ httpd_ssl_dir }}/certs/katello-apache-{{ _type }}.crt"
    mode: "0640"
  loop: "{{ certificates_enabled_algorithms }}"
  vars:
    _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    cert_src: "{{ certificates_output_directory_certs }}/{{ ansible_facts['fqdn'] }}-{{ _type }}.crt"
    ca_src: >-
      {% if item == certificates_primary_algorithm and certificates_source == 'custom_server' %}{{ httpd_server_ca_certificate }}
      {%- else %}{{ certificates_ca_directory_certs }}/{{ _type }}-ca.crt{% endif %}
  when: certificates_enabled_algorithms | length > 1
  notify:
    - Restart httpd

- name: Deploy per-algorithm server private keys
  ansible.builtin.copy:
    src: "{{ src }}"
    dest: "{{ httpd_ssl_dir }}/{{ dest }}"
    remote_src: true
    mode: "0640"
  loop: "{{ certificates_enabled_algorithms }}"
  vars:
    _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    src: "{{ certificates_output_directory_keys }}/{{ ansible_facts['fqdn'] }}-{{ _type }}.key"
    dest: "private/katello-apache-{{ _type }}.key"
  when: certificates_enabled_algorithms | length > 1
  notify:
    - Restart httpd

- name: Deploy per-algorithm server private keys
  ansible.builtin.copy:
    src: "{{ src }}"
    dest: "{{ httpd_ssl_dir }}/{{ dest }}"
    remote_src: true
    mode: "0640"
  loop: "{{ certificates_enabled_algorithms }}"
  vars:
    _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    src: "{{ certificates_output_directory_keys }}/{{ ansible_facts['fqdn'] }}-{{ _type }}.key"
    dest: "private/katello-apache-{{ _type }}.key"
  when: certificates_enabled_algorithms | length > 1
  notify:
    - Restart httpd

- name: Copy CA certificate to pub directory for client trust
  ansible.builtin.copy:
    src: "{{ httpd_ca_bundle }}"
    dest: "{{ httpd_pub_dir }}/katello-server-ca.crt"
    remote_src: true
    mode: "0644"

- name: Configure MPM event module
  ansible.builtin.template:
    src: event.conf.j2
    dest: /etc/httpd/conf.modules.d/event.conf
    mode: "0644"
    setype: httpd_config_t
  notify:
    - Restart httpd

- name: Configure external authentication
  ansible.builtin.include_tasks: "external_auth/{{ httpd_external_authentication }}.yml"
  when:
    - httpd_with_foreman
    - httpd_external_authentication in ['ipa', 'ipa_with_api']

- name: Remove external authentication configuration if not enabled
  ansible.builtin.include_tasks: external_auth/cleanup.yml
  when:
    - httpd_with_foreman
    - httpd_external_authentication is none


- name: Configure vhost
  ansible.builtin.template:
    src: foreman-vhost.conf.j2
    dest: /etc/httpd/conf.d/{{ 'foreman' if httpd_with_foreman else 'pulpcore' }}.conf
    mode: "0644"
    setype: httpd_config_t
  notify:
    - Restart httpd

- name: Configure SSL vhost
  ansible.builtin.template:
    src: foreman-ssl-vhost.conf.j2
    dest: /etc/httpd/conf.d/{{ 'foreman-ssl' if httpd_with_foreman else 'pulpcore-ssl' }}.conf
    mode: "0644"
    setype: httpd_config_t
  notify:
    - Restart httpd

- name: Create systemd drop-in directory for httpd
  ansible.builtin.file:
    path: /etc/systemd/system/httpd.service.d
    state: directory
    mode: "0755"

- name: Add httpd to foreman.target
  ansible.builtin.copy:
    dest: /etc/systemd/system/httpd.service.d/foreman-target.conf
    mode: "0644"
    content: |
      [Install]
      WantedBy=default.target foreman.target
      [Unit]
      PartOf=foreman.target

- name: Ensure httpd starts after foreman.socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/httpd.service.d/foreman-socket.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=foreman.socket
      After=foreman.socket
  when: httpd_with_foreman

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers

- name: Start Apache httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

---
# Container images that make up a Foreman infrastructure deployment, published
# through this server's container registry so that proxies or other Foreman
# servers in a hub-and-spoke setup can pull them from here instead of the
# internet.
#
# Upstream defaults use the public quay.io/foreman images.
#
# Downstream vendors override these by shipping a file at
# src/vars/vendor/infra-registry-images.yml (loaded automatically if present).
# A vendor file replaces the whole dict, so each entry must define
# repository_name, upstream_name, base_tag and unit_name.
#
# unit_name is the quadlet image unit basename (e.g. "foreman-proxy" for
# /etc/containers/systemd/foreman-proxy.image) this entry corresponds to, if
# any is deployed on this host. When present, the infra_images role resolves
# that unit's actually-configured image/tag via systemd and uses it instead
# of upstream_name/base_tag below - a vendor may repoint an image via a
# quadlet drop-in without updating this file, and the two can drift out of
# sync otherwise.

# Registry each image is synced from.
infra_registry_url: https://quay.io

# Image definitions published by the registry sync.
infra_registry_images:
  foreman:
    repository_name: foreman
    upstream_name: foreman/foreman
    base_tag: "{{ foreman_container_tag }}"
  foreman_proxy:
    repository_name: foreman-proxy
    upstream_name: foreman/foreman-proxy
    base_tag: "{{ foreman_proxy_container_tag }}"
  candlepin:
    repository_name: candlepin
    upstream_name: foreman/candlepin
    base_tag: "{{ candlepin_container_tag }}"
  pulp:
    repository_name: pulp
    upstream_name: foreman/pulp
    base_tag: "{{ pulp_container_tag }}"
  postgresql:
    repository_name: postgresql-16
    upstream_name: sclorg/postgresql-16-c10s
    base_tag: "{{ postgresql_container_tag }}"
    unit_name: postgresql
  valkey:
    repository_name: valkey-8
    upstream_name: sclorg/valkey-8-c10s
    base_tag: "{{ valkey_container_tag }}"
    unit_name: valkey

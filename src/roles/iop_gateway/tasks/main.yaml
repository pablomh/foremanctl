---
- name: Deploy iop-gateway image
  ansible.builtin.include_tasks: image.yaml

- name: Create Gateway ssl.conf secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-ssl-conf
    data: "{{ lookup('ansible.builtin.template', 'ssl.conf.j2') }}"
  notify: Restart gateway

- name: Initialize Gateway per-algorithm server secret mounts list
  ansible.builtin.set_fact:
    _iop_gateway_algorithm_secrets: []

- name: 'Configure the Gateway server secrets in single-algorithm mode'
  when: certificates_enabled_algorithms | length == 1
  vars:
    _type: "{{ certificates_primary_algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    _ca_src: "{{ certificates_ca_directory_certs }}/ca.crt"
  block:
    # lookup() always reads from the controller; these files only exist on the target.
    - name: Read single-algorithm server certificate and CA
      ansible.builtin.command:
        cmd: "cat {{ iop_gateway_server_certificate }} {{ _ca_src }}"
      register: _iop_gateway_single_algorithm_chain
      changed_when: false

    # Embed the issuing CA with the leaf, matching httpd's per-algorithm chains.
    - name: Create Gateway server certificate secret
      containers.podman.podman_secret:
        state: present
        name: "iop-core-gateway-server-cert-{{ _type }}"
        data: "{{ _iop_gateway_single_algorithm_chain.stdout }}\n"
      notify: Restart gateway

    - name: Create Gateway server key secret
      containers.podman.podman_secret:
        state: present
        name: "iop-core-gateway-server-key-{{ _type }}"
        path: "{{ iop_gateway_server_key }}"
      notify: Restart gateway

    - name: Build Gateway single-algorithm server secret mounts
      ansible.builtin.set_fact:
        _iop_gateway_algorithm_secrets: >-
          {{ _iop_gateway_algorithm_secrets
             + ['iop-core-gateway-server-cert-' + _type + ',target=/etc/nginx/certs/nginx-' + _type + '.crt,mode=0440,uid=998,gid=998,type=mount',
                'iop-core-gateway-server-key-' + _type + ',target=/etc/nginx/certs/nginx-' + _type + '.key,mode=0440,uid=998,gid=998,type=mount'] }}

- name: 'Configure the Gateway server secrets in multi-scheme mode'
  when: certificates_enabled_algorithms | length > 1
  block:
    # lookup() always reads from the controller; these files only exist on the target.
    - name: Read per-algorithm server certificate and CA
      ansible.builtin.command:
        cmd: "cat {{ cert_src }} {{ ca_src }}"
      register: _iop_gateway_per_algorithm_chains
      changed_when: false
      loop: "{{ certificates_enabled_algorithms }}"
      loop_control:
        label: "{{ item }}"
      vars:
        _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"
        cert_src: "{{ iop_gateway_server_certificate | dirname }}/iop-core-gateway-{{ _type }}.crt"
        ca_src: "{{ certificates_ca_directory_certs }}/{{ _type }}-ca.crt"

    - name: Create Gateway per-algorithm server certificate secret
      containers.podman.podman_secret:
        state: present
        name: "iop-core-gateway-server-cert-{{ item.item | lower | regex_replace('^ml-dsa', 'mldsa') }}"
        data: "{{ item.stdout }}\n"
      notify: Restart gateway
      loop: "{{ _iop_gateway_per_algorithm_chains.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create Gateway per-algorithm server key secret
      containers.podman.podman_secret:
        state: present
        name: "iop-core-gateway-server-key-{{ _type }}"
        path: "{{ iop_gateway_server_key | dirname }}/iop-core-gateway-{{ _type }}.key"
      notify: Restart gateway
      loop: "{{ certificates_enabled_algorithms }}"
      vars:
        _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"

    - name: Build Gateway per-algorithm server secret mounts
      ansible.builtin.set_fact:
        _iop_gateway_algorithm_secrets: >-
          {{ _iop_gateway_algorithm_secrets
             + ['iop-core-gateway-server-cert-' + _type + ',target=/etc/nginx/certs/nginx-' + _type + '.crt,mode=0440,uid=998,gid=998,type=mount',
                'iop-core-gateway-server-key-' + _type + ',target=/etc/nginx/certs/nginx-' + _type + '.key,mode=0440,uid=998,gid=998,type=mount'] }}
      loop: "{{ certificates_enabled_algorithms }}"
      vars:
        _type: "{{ item | lower | regex_replace('^ml-dsa', 'mldsa') }}"

- name: Create Gateway server CA certificate secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-server-ca-cert
    path: "{{ iop_gateway_server_ca_certificate }}"
  notify: Restart gateway

- name: Create Gateway client certificate secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-client-cert
    path: "{{ iop_gateway_client_certificate }}"
  notify: Restart gateway

- name: Create Gateway client key secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-client-key
    path: "{{ iop_gateway_client_key }}"
  notify: Restart gateway

- name: Create Gateway client CA certificate secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-client-ca-cert
    path: "{{ iop_gateway_client_ca_certificate }}"
  notify: Restart gateway

- name: Create Gateway relay configuration secret
  containers.podman.podman_secret:
    state: present
    name: iop-core-gateway-relay-conf
    data: "{{ lookup('ansible.builtin.template', 'relay.conf.j2') }}"
  notify: Restart gateway

- name: Deploy Gateway container
  containers.podman.podman_container:
    name: iop-core-gateway
    image: iop-gateway.image
    state: quadlet
    network:
      - foreman-core-network
    publish:
      - "127.0.0.1:24443:8443"
    secrets: >-
      {{ [
        'iop-core-gateway-server-ca-cert,target=/etc/nginx/certs/ca.crt,mode=0440,uid=998,gid=998,type=mount',
        'iop-core-gateway-client-cert,target=/etc/nginx/smart-proxy-relay/certs/proxy.crt,mode=0440,uid=998,gid=998,type=mount',
        'iop-core-gateway-client-key,target=/etc/nginx/smart-proxy-relay/certs/proxy.key,mode=0440,uid=998,gid=998,type=mount',
        'iop-core-gateway-client-ca-cert,target=/etc/nginx/smart-proxy-relay/certs/ca.crt,mode=0440,uid=998,gid=998,type=mount',
        'iop-core-gateway-relay-conf,target=/etc/nginx/smart-proxy-relay/relay.conf,mode=0440,uid=998,gid=998,type=mount',
        'iop-core-gateway-ssl-conf,target=/etc/nginx/conf.d/ssl.conf,mode=0440,uid=998,gid=998,type=mount',
      ] + _iop_gateway_algorithm_secrets }}
    quadlet_options:
      - |
        [Unit]
        Description=IOP Core Gateway Container
        After=iop-core-kafka.service iop-core-engine.service iop-core-ingress.service
        Wants=iop-core-kafka.service iop-core-engine.service iop-core-ingress.service
        PartOf=foreman.target
        [Service]
        Restart=on-failure
        [Install]
        WantedBy=multi-user.target
        WantedBy=default.target foreman.target

- name: Run daemon reload to make Quadlet create the service files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers

- name: Start Gateway service
  ansible.builtin.systemd:
    name: iop-core-gateway
    state: started

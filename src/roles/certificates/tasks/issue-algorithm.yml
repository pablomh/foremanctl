---
- name: 'Load key parameters for this algorithm'
  ansible.builtin.include_vars: "{{ algorithm }}.yml"

- name: 'Generate server private key'
  community.crypto.openssl_privatekey:
    path: "{{ certificates_output_directory_keys }}/{{ certificates_hostname }}-{{ _type }}.key"
    type: "{{ _certificates_key_parameters.type }}"
    size: "{{ _certificates_key_parameters.size | default(omit) }}"
    curve: "{{ _certificates_key_parameters.curve | default(omit) }}"
    format: "{{ _certificates_key_parameters.format | default(omit) }}"
    mode: '0600'
  vars:
    _type: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"

- name: 'Generate server CSR'
  community.crypto.openssl_csr:
    path: "{{ certificates_output_directory_requests }}/{{ certificates_hostname }}-{{ _type }}.csr"
    privatekey_path: "{{ certificates_output_directory_keys }}/{{ certificates_hostname }}-{{ _type }}.key"
    common_name: "{{ certificates_hostname }}"
    subject_alt_name: "{{ _san_list }}"
    key_usage: "{{ _certificates_key_usage }}"
    extended_key_usage:
      - serverAuth
  vars:
    _type: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    _alias_sans: "{{ certificates_server_aliases if certificates_hostname != 'localhost' else [] }}"
    _named_sans: "{{ certificates_hostname_extra_sans[certificates_hostname] | default([]) }}"
    _extra_sans: "{{ (_alias_sans + _named_sans) | unique }}"
    _san_list: "{{ ([certificates_hostname] + _extra_sans) | unique | map('regex_replace', '^', 'DNS:') | list }}"

- name: 'Sign server certificate'
  community.crypto.x509_certificate:
    path: "{{ certificates_output_directory_certs }}/{{ certificates_hostname }}-{{ _type }}.crt"
    csr_path: "{{ certificates_output_directory_requests }}/{{ certificates_hostname }}-{{ _type }}.csr"
    provider: ownca
    ownca_path: "{{ certificates_ca_directory_certs }}/{{ _type }}-ca.crt"
    ownca_privatekey_path: "{{ certificates_ca_directory_keys }}/{{ _type }}-ca.key"
    ownca_not_after: "+{{ certificates_validity_days }}d"
    force: "{{ certificates_renew | bool }}"
  vars:
    _type: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"

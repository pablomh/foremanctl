---
# Generate per-algorithm server certs for non-RSA entries in certificates_algorithm_sets.
# Each cert is signed by the corresponding per-algorithm CA ({slug}-ca.crt) and stored
# as {hostname}-{slug}.crt for downstream roles (e.g. httpd dual-cert) to consume.
#
# Loop var: certificates_hostname (set by caller in main.yml)

- name: 'Generate per-algorithm server private key'
  community.crypto.openssl_privatekey:
    path: "{{ certificates_output_directory_keys }}/{{ certificates_hostname }}-{{ slug }}.key"
    type: "{{ algorithm }}"
    mode: '0600'
  loop: "{{ certificates_algorithm_sets | reject('equalto', 'RSA') | list }}"
  loop_control:
    loop_var: algorithm
  vars:
    slug: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"

- name: 'Generate per-algorithm server CSR'
  community.crypto.openssl_csr:
    path: "{{ certificates_output_directory_requests }}/{{ certificates_hostname }}-{{ slug }}.csr"
    privatekey_path: "{{ certificates_output_directory_keys }}/{{ certificates_hostname }}-{{ slug }}.key"
    common_name: "{{ certificates_hostname }}"
    subject_alt_name: "{{ _san_list }}"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
  loop: "{{ certificates_algorithm_sets | reject('equalto', 'RSA') | list }}"
  loop_control:
    loop_var: algorithm
  vars:
    slug: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"
    _alias_sans: "{{ certificates_server_aliases if certificates_hostname != 'localhost' else [] }}"
    _named_sans: "{{ certificates_hostname_extra_sans[certificates_hostname] | default([]) }}"
    _extra_sans: "{{ (_alias_sans + _named_sans) | unique }}"
    _san_list: "{{ ([certificates_hostname] + _extra_sans) | unique | map('regex_replace', '^', 'DNS:') | list }}"

- name: 'Sign per-algorithm server certificate'
  community.crypto.x509_certificate:
    path: "{{ certificates_output_directory_certs }}/{{ certificates_hostname }}-{{ slug }}.crt"
    csr_path: "{{ certificates_output_directory_requests }}/{{ certificates_hostname }}-{{ slug }}.csr"
    provider: ownca
    ownca_path: "{{ certificates_ca_directory_certs }}/{{ slug }}-ca.crt"
    ownca_privatekey_path: "{{ certificates_ca_directory_keys }}/{{ slug }}-ca.key"
    ownca_not_after: "+{{ certificates_validity_days }}d"
    force: "{{ certificates_renew | bool }}"
  loop: "{{ certificates_algorithm_sets | reject('equalto', 'RSA') | list }}"
  loop_control:
    loop_var: algorithm
  vars:
    slug: "{{ algorithm | lower | regex_replace('^ml-dsa', 'mldsa') }}"

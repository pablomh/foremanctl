---
- name: Inspect the CA key algorithm for the Candlepin crypto scheme
  community.crypto.openssl_privatekey_info:
    path: "{{ candlepin_ca_key }}"
  register: _candlepin_ca_key_info

- name: Create the podman secret for Candlepin CA certificate
  containers.podman.podman_secret:
    state: present
    name: candlepin-ca-cert
    path: "{{ candlepin_ca_certificate }}"
    labels:
      app: candlepin
  notify:
    - Restart candlepin

- name: Create the podman secret for Candlepin CA key
  containers.podman.podman_secret:
    state: present
    name: candlepin-ca-key
    path: "{{ candlepin_ca_key }}"
    labels:
      app: candlepin
  notify:
    - Restart candlepin

- name: Create the podman secret for Tomcat certificate
  containers.podman.podman_secret:
    state: present
    name: candlepin-tomcat-cert
    path: "{{ candlepin_tomcat_certificate }}"
    labels:
      app: tomcat
  notify:
    - Restart candlepin

- name: Create the podman secret for Tomcat key
  containers.podman.podman_secret:
    state: present
    name: candlepin-tomcat-key
    path: "{{ candlepin_tomcat_key }}"
    labels:
      app: tomcat
  notify:
    - Restart candlepin

- name: Generate extra Tomcat private key
  community.crypto.openssl_privatekey:
    path: "{{ kdir }}/localhost-{{ slug }}.key"
    type: "{{ item }}"
    size: "{{ certificates_algorithm_rsa_size if item == 'RSA' else omit }}"
    curve: "{{ certificates_algorithm_ecc_curve if item == 'ECC' else omit }}"
    format: "{{ 'pkcs8' if item == 'ECC' else omit }}"
    mode: '0600'
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    kdir: "{{ certificates_output_directory_keys }}"

- name: Generate extra Tomcat CSR
  community.crypto.openssl_csr:
    path: "{{ rdir }}/localhost-{{ slug }}.csr"
    privatekey_path: "{{ kdir }}/localhost-{{ slug }}.key"
    common_name: localhost
    subject_alt_name:
      - "DNS:localhost"
    key_usage: "{{ _key_usage }}"
    extended_key_usage:
      - serverAuth
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    rdir: "{{ certificates_output_directory_requests }}"
    kdir: "{{ certificates_output_directory_keys }}"
    _key_usage: >-
      {{ ['digitalSignature'] +
         (['keyEncipherment'] if item == 'RSA' else []) }}

- name: Sign extra Tomcat certificate
  community.crypto.x509_certificate:
    path: "{{ cdir }}/localhost-{{ slug }}.crt"
    csr_path: "{{ rdir }}/localhost-{{ slug }}.csr"
    provider: ownca
    ownca_path: "{{ certificates_ca_directory_certs }}/ca.crt"
    ownca_privatekey_path: "{{ certificates_ca_directory_keys }}/ca.key"
    ownca_not_after: "+{{ certificates_validity_days }}d"
    force: "{{ certificates_renew | bool }}"
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    cdir: "{{ certificates_output_directory_certs }}"
    rdir: "{{ certificates_output_directory_requests }}"

- name: Create podman secret for extra Tomcat certificate
  containers.podman.podman_secret:
    state: present
    name: "candlepin-tomcat-{{ slug }}-cert"
    path: "{{ certificates_output_directory_certs }}/localhost-{{ slug }}.crt"
    labels:
      app: tomcat
  notify:
    - Restart candlepin
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"

- name: Create podman secret for extra Tomcat key
  containers.podman.podman_secret:
    state: present
    name: "candlepin-tomcat-{{ slug }}-key"
    path: "{{ certificates_output_directory_keys }}/localhost-{{ slug }}.key"
    labels:
      app: tomcat
  notify:
    - Restart candlepin
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"

- name: Initialize extra Tomcat TLS secret mounts list
  ansible.builtin.set_fact:
    _candlepin_extra_tls_secrets: []

- name: Build extra Tomcat TLS secret mounts
  ansible.builtin.set_fact:
    _candlepin_extra_tls_secrets: "{{ _candlepin_extra_tls_secrets
      + ['candlepin-tomcat-' + slug + '-cert,target=/etc/candlepin/certs/tomcat-' + slug + '.crt,' + candlepin_secret_mount_opts,
         'candlepin-tomcat-' + slug + '-key,target=/etc/candlepin/certs/tomcat-' + slug + '.key,' + candlepin_secret_mount_opts] }}"
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"

- name: Generate extra Candlepin CA key
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - "{{ item }}"
      - -out
      - "{{ certificates_ca_directory_keys }}/candlepin-{{ slug }}-ca.key"
    creates: "{{ certificates_ca_directory_keys }}/candlepin-{{ slug }}-ca.key"
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"

- name: Generate extra Candlepin CA certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -new
      - -key
      - "{{ certificates_ca_directory_keys }}/candlepin-{{ slug }}-ca.key"
      - -subj
      - "/CN=Satellite {{ item }} CA"
      - -days
      - "{{ certificates_ca_validity_days }}"
      - -out
      - "{{ certificates_ca_directory_certs }}/candlepin-{{ slug }}-ca.crt"
    creates: "{{ certificates_ca_directory_certs }}/candlepin-{{ slug }}-ca.crt"
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"

- name: Create podman secret for extra Candlepin CA certificate
  containers.podman.podman_secret:
    state: present
    name: "candlepin-{{ sid }}-ca-cert"
    path: "{{ certificates_ca_directory_certs }}/candlepin-{{ slug }}-ca.crt"
    labels:
      app: candlepin
  notify:
    - Restart candlepin
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    sid: "{{ _candlepin_algorithms[item].scheme_id }}"

- name: Create podman secret for extra Candlepin CA key
  containers.podman.podman_secret:
    state: present
    name: "candlepin-{{ sid }}-ca-key"
    path: "{{ certificates_ca_directory_keys }}/candlepin-{{ slug }}-ca.key"
    labels:
      app: candlepin
  notify:
    - Restart candlepin
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    sid: "{{ _candlepin_algorithms[item].scheme_id }}"

- name: Initialize extra Candlepin CA secret mounts list
  ansible.builtin.set_fact:
    _candlepin_extra_ca_secrets: []

- name: Build extra Candlepin CA secret mounts
  ansible.builtin.set_fact:
    _candlepin_extra_ca_secrets: "{{ _candlepin_extra_ca_secrets
      + ['candlepin-' + sid + '-ca-cert,target=/etc/candlepin/certs/candlepin-' + slug + '-ca.crt,' + candlepin_secret_mount_opts,
         'candlepin-' + sid + '-ca-key,target=/etc/candlepin/certs/candlepin-' + slug + '-ca.key,' + candlepin_secret_mount_opts] }}"
  loop: "{{ certificates_algorithm_sets }}"
  vars:
    slug: "{{ _candlepin_algorithms[item].file_suffix }}"
    sid: "{{ _candlepin_algorithms[item].scheme_id }}"

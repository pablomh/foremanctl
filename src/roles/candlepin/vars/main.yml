---
# Candlepin signs the entitlement and identity certificates it issues with the
# deployment CA key. It describes the key and signature algorithms it may use
# through a named crypto "scheme"; the built-in "legacy" scheme assumes RSA
# (SHA256withRSA), so Candlepin refuses to start when handed a non-RSA CA key
# unless the scheme is redefined. We override the legacy scheme in
# candlepin.conf.j2 using the values below.
#
# The algorithm is derived from the CA key that was actually deployed (inspected
# in certs.yml) rather than from the requested certificate algorithm, so custom
# and migrated CAs are handled the same way as generated ones.

# openssl_privatekey_info reports the CA key type as RSA, ECC,
# ML-DSA-65 or ML-DSA-87.
# All per-algorithm properties are co-located here so adding a new algorithm
# requires updating only this one dict.
#
# cert_type        - Tomcat SSLHostConfig <Certificate type=> value
# scheme_signature - JCA (BouncyCastle) signature algorithm name used
#                    by Candlepin to sign entitlement/identity certs
# scheme_key       - JCA KeyPairGenerator algorithm for issued keys
# file_suffix      - suffix in file/secret names (e.g. localhost-mldsa-65.key)
_candlepin_algorithms:
  RSA:
    cert_type: RSA
    scheme_signature: SHA256withRSA
    scheme_key: RSA
    scheme_key_size: "{{ certificates_algorithm_rsa_size }}"
    file_suffix: rsa
    scheme_id: rsa
  ECC:
    cert_type: EC
    scheme_signature: SHA256withECDSA
    scheme_key: EC
    scheme_key_size: >-
      {{ _candlepin_ec_curve_key_sizes[certificates_algorithm_ecc_curve] | default('') }}
    file_suffix: ecc
    scheme_id: ecc
  ML-DSA-65:
    cert_type: MLDSA
    scheme_signature: ML-DSA-65
    scheme_key: ML-DSA-65
    file_suffix: mldsa-65
    scheme_id: mldsa65
  ML-DSA-87:
    cert_type: MLDSA
    scheme_signature: ML-DSA-87
    scheme_key: ML-DSA-87
    file_suffix: mldsa-87
    scheme_id: mldsa87

_candlepin_ca_key_algorithm: "{{ _candlepin_ca_key_info.type }}"

# EC keys are sized in Candlepin by bit length; map the curves we offer to the
# matching NIST key size so Candlepin issues keys on the same curve as the CA.
_candlepin_ec_curve_key_sizes:
  secp256r1: 256
  secp384r1: 384
  secp521r1: 521

_candlepin_scheme_signature_algorithm: >-
  {{ _candlepin_algorithms[_candlepin_ca_key_algorithm].scheme_signature }}
_candlepin_scheme_key_algorithm: >-
  {{ _candlepin_algorithms[_candlepin_ca_key_algorithm].scheme_key }}
_candlepin_tls_protocols: >-
  {{ 'TLSv1.3' if (
       _candlepin_ca_key_algorithm.startswith('ML-DSA') and
       certificates_algorithm_sets | length == 0
     )
     else candlepin_tls_versions | join(',') }}
_candlepin_scheme_key_size: >-
  {{ _candlepin_ec_curve_key_sizes[
       _candlepin_ca_key_info.public_data.curve | default('')
     ] | default('')
     if _candlepin_ca_key_algorithm == 'ECC' else '' }}
